name: Keep portfolio offline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare offline page
        run: |
          mkdir -p offline
          printf '%s\\n' '<!doctype html><html><head><meta charset="utf-8"><title>404</title></head><body><h1>404</h1></body></html>' > offline/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./offline

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
